name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Pytest (exclude deploy test)
        run: |
          pytest --ignore=tests/test_cp5.py
          
      - name: Build Docker Image
        run: |
          docker build -t day12-agent:latest .

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Cloud
        run: |
          echo "Triggering deployment using webhook..."
          curl -s "${{ secrets.DEPLOY_WEBHOOK_URL }}"
